name: ${COMPOSE_PROJECT_NAME:-relawan-platform}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-relawan_db}
      MYSQL_USER: ${MYSQL_USER:-relawan_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ganti_password_development}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ganti_password_root_development}
      TZ: Asia/Jakarta
    ports:
      - "${MYSQL_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - relawan-network

  phpmyadmin:
    image: phpmyadmin:latest
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - relawan-network

  backend:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/dev-backend.Dockerfile
    working_dir: /var/www/html
    command: sh -lc "composer install && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-relawan_db}
      DB_USERNAME: ${MYSQL_USER:-relawan_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ganti_password_development}
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - relawan-network

  frontend:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/dev-frontend.Dockerfile
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - relawan-network

networks:
  relawan-network:
    driver: bridge

volumes:
  mysql_data:
  frontend_node_modules:
  frontend_next_cache:
